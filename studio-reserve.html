<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スタジオレンタルのご予約 | Final Sound Design</title>
  <meta name="description" content="Final Sound Designのスタジオレンタルのご予約ページです。">
  <meta name="robots" content="noindex">
  <link rel="icon" href="image/logo-square.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=afe0de44">
  <style>
    .prep-page {
      min-height: 100dvh;
      padding-top: calc(var(--header-h) + 4rem);
      padding-bottom: 6rem;
      background: var(--color-bg);
    }
    .prep-body {
      max-width: 720px;
      margin-inline: auto;
      padding-inline: var(--container-pad);
      text-align: center;
    }
    .prep-label {
      display: block;
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: var(--color-accent);
      margin-bottom: 1rem;
    }
    .prep-title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      color: var(--color-white);
      margin-bottom: 2rem;
    }
    .prep-text {
      font-size: 0.9rem;
      color: var(--color-text-muted);
      line-height: 1.9;
      margin-bottom: 2.5rem;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .prep-contact {
      display: inline-flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1.5rem 2rem;
      border: 1px solid var(--color-border-2);
      margin-bottom: 3rem;
      text-align: left;
    }
    .prep-contact dt {
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--color-accent);
    }
    .prep-contact dd {
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
      overflow-wrap: anywhere;
    }
    .prep-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--color-text-muted);
      transition: color var(--transition);
    }
    .prep-back:hover {
      color: var(--color-accent);
    }
    .prep-back svg {
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header class="site-header" role="banner">
    <div class="header-inner container">
      <a href="index.html" class="logo-link" aria-label="Final Sound Design トップへ">
        <img src="image/Web用横長ロゴ.png" alt="Final Sound Design" width="192" height="64" class="logo-img">
      </a>
    </div>
  </header>

  <main class="prep-page">
    <div class="prep-body">

      <span class="prep-label">STUDIO RENTAL</span>
      <h1 class="prep-title">ただいま準備中です</h1>

      <p class="prep-text">スタジオレンタルのご予約ページは、<br class="mobile-break">ただいま準備中です。<br>ご不明点や事前確認などは、<br class="mobile-break">下記の連絡先より<br class="mobile-break">お気軽にご連絡くださいませ。</p>

      <dl class="prep-contact">
        <div>
          <dt>電話番号</dt>
          <dd><a href="tel:09026796442" class="info-link">090-2679-6442</a></dd>
        </div>
        <div>
          <dt>メールアドレス</dt>
          <dd><a href="mailto:final.sound.design331@gmail.com" class="info-link">final.sound.design331<wbr>@gmail.com</a></dd>
        </div>
      </dl>

      <div>
        <a href="index.html" class="prep-back">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          トップページに戻る
        </a>
      </div>

    </div>
  </main>

</body>
</html>
